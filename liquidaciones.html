<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>ALS · Liquidaciones AEAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="auth-guard.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --w:#fff;--g50:#f8f9fa;--g100:#f1f3f5;--g200:#e9ecef;--g300:#dee2e6;
  --g400:#ced4da;--g500:#adb5bd;--g600:#6c757d;--g700:#495057;--g800:#343a40;--g900:#212529;
  --b50:#e7f1ff;--b100:#c5dbff;--b500:#3b82f6;--b600:#2563eb;--b700:#1d4ed8;
  --gr50:#f0fdf4;--gr600:#16a34a;--gr700:#15803d;
  --rd50:#fff1f2;--rd600:#dc2626;
  --am50:#fffbeb;--am600:#d97706;
  --f:'Inter',sans-serif;--mono:'DM Mono',monospace;
  --r:8px;--rl:12px;--rxl:16px;
  --sh:0 1px 3px rgba(0,0,0,.08);--shl:0 4px 16px rgba(0,0,0,.1);
}
body{font-family:var(--f);background:var(--g50);color:var(--g900);min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--w);border:1px solid var(--g200);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--g600);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12px;color:var(--g500);margin-top:2px}
.kpi.rd{border-left:4px solid var(--rd600)} .kpi.rd .v{color:var(--rd600)}
.kpi.am{border-left:4px solid var(--am600)} .kpi.am .v{color:var(--am600)}
.kpi.b{border-left:4px solid var(--b600)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.sync{font-size:12px;color:var(--g600)}
.sync.err{color:var(--rd600);font-weight:600}
.btn{border:none;border-radius:var(--r);padding:7px 14px;font-family:var(--f);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--b600);color:#fff}
.btn-sec{background:var(--w);color:var(--g700);border:1px solid var(--g200)}
.btn-ok{background:var(--gr50);color:var(--gr700);border:1px solid #bbf7d0}
.seg{display:inline-flex;border:1px solid var(--g200);border-radius:var(--r);overflow:hidden;background:var(--w)}
.seg button{border:none;background:none;padding:7px 12px;font:600 12px var(--f);color:var(--g600);cursor:pointer}
.seg button.on{background:var(--b50);color:var(--b700)}
.card{background:var(--w);border:1px solid var(--g200);border-radius:var(--rl);box-shadow:var(--sh)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:9px 10px;font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--g200);background:var(--g50);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--g100);vertical-align:middle;white-space:nowrap}
tr.grp td{background:var(--g50);font-weight:700;color:var(--g700);font-size:12px}
.m{font-family:var(--mono);font-size:12px}
.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.p-rd{background:var(--rd50);color:var(--rd600)}
.p-am{background:var(--am50);color:var(--am600)}
.p-b{background:var(--b50);color:var(--b700)}
.p-gr{background:var(--gr50);color:var(--gr700)}
.p-g{background:var(--g100);color:var(--g600)}
.imp-n{color:var(--g500);font-size:11px;display:block}
.link{color:var(--b600);cursor:pointer;text-decoration:underline dotted}
td.m a{color:var(--b600);text-decoration:none}
td.m a:hover{text-decoration:underline}
.empty{padding:40px;text-align:center;color:var(--g500)}
tr.done td{opacity:.55}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--w);border-radius:var(--rxl);box-shadow:var(--shl);width:100%;max-width:440px}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--g200)}
.mhdr h2{font-size:15px}
.mhdr button{border:none;background:none;font-size:22px;cursor:pointer;color:var(--g500)}
.mbody{padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.mbody label{font-size:12px;font-weight:600;color:var(--g700)}
.mbody input,.mbody textarea{width:100%;border:1px solid var(--g300);border-radius:var(--r);padding:8px 10px;font:13px var(--f)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--g200)}
.tit{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tit h1{font-size:18px;font-weight:800}
.tit span{font-size:13px;color:var(--g600)}
@media(max-width:640px){.wrap{padding:12px}}
</style>
</head>
<body>
<!-- Header unificado: PortalGuard.mountHeader -->
<div id="pg-header-app"></div>

<div class="wrap" id="app">
  <div class="tit"><h1>Liquidaciones AEAT</h1><span>Deudas de Comercio Exterior pendientes de pago</span></div>
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <div class="seg" id="seg">
      <button data-f="pend" class="on">Pendientes</button>
      <button data-f="semana">Próximos 15 días</button>
      <button data-f="todas">Todas</button>
    </div>
    <span class="grow"></span>
    <span class="sync" id="sync"></span>
    <button class="btn btn-sec" onclick="cargar()">&#8635; Actualizar</button>
  </div>
  <div class="card"><div class="tbl-wrap" id="tabla"><div class="empty">Cargando…</div></div></div>
</div>
<div id="modal-root"></div>

<script>
// Guard: sesión Supabase vía PortalGuard + permiso DUA o TARIC (mismo criterio que RMT
// en la pantalla de Aduanas). auth-guard.js pone también el icono CW de la pestaña.
var CU = null, sb = null;
(async function () {
  if (!window.PortalGuard) { document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">No se pudo cargar auth-guard.js</p>'; return; }
  const ok = await PortalGuard.require(null);
  if (!ok) return;
  if (!(PortalGuard.puedeAcceder('dua', 'ver') || PortalGuard.puedeAcceder('taric', 'ver'))) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#f8f9fa"><div style="text-align:center;padding:2rem">' +
      '<div style="font-size:48px;margin-bottom:12px">🔒</div><h2 style="margin-bottom:8px;color:#212529">Acceso denegado</h2>' +
      '<p style="color:#6c757d;margin-bottom:20px">No tienes permisos para Liquidaciones AEAT.</p>' +
      '<a href="index.html" style="background:#2563eb;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600">← Volver al portal</a></div></div>';
    return;
  }
  sb = PortalGuard.sb;
  CU = PortalGuard.CU;
  try { PortalGuard.mountHeader({ mount: '#pg-header-app', module: 'Aduanas', section: 'Liquidaciones AEAT' }); } catch (e) {}
  iniciarLiquidaciones();
})();
</script>
<script>
function iniciarLiquidaciones() {

let filas = [], nombres = {}, filtro = 'pend';
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];

const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const sumaDias = (iso, n) => { const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
// Formato propio: es-ES no pone punto de miles en cifras de 4 dígitos (1064,43)
const eur = n => { const [e, d] = Number(n||0).toFixed(2).split('.'); return e.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d + ' €'; };
const fmt = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const diasHasta = iso => Math.round((new Date(iso+'T12:00:00') - new Date(hoyISO()+'T12:00:00'))/86400000);

// Periodo de aviso: los próximos 15 días contando hoy (igual que el email de los miércoles)
const DIAS_AVISO = 15;
function periodo() {
  const h = hoyISO();
  return [h, sumaDias(h, DIAS_AVISO - 1)];
}

const viva = f => f.estado_aeat === 'pendiente' && !f.pagada_manual;

// Ficha de la liquidación en la Sede AEAT (se abre con el certificado de quien pulsa)
const urlLiq = f => f.nc ? 'https://www1.agenciatributaria.gob.es/wlpl/inwinvoc/es.aeat.dit.adu.adco.agrupaciones.acc.DetLiquida?NC='+encodeURIComponent(f.nc)+'&TIPO_OPERADOR=D' : '';

function estado(f) {
  if (f.estado_aeat === 'ingresada') return '<span class="pill p-gr" title="La AEAT la da como Ingresada">✓ Pagada (AEAT)</span>';
  if (f.pagada_manual) return '<span class="pill p-gr">Pagada (marcada)</span>';
  if (f.estado_aeat !== 'pendiente') return '<span class="pill p-g">Ya no figura pendiente</span>';
  const d = diasHasta(f.fecha_limite);
  if (d < 0) return '<span class="pill p-rd">Vencida hace '+(-d)+' d</span>';
  if (d === 0) return '<span class="pill p-rd">Vence HOY</span>';
  if (d <= 3) return '<span class="pill p-am">'+d+' día'+(d>1?'s':'')+'</span>';
  return '<span class="pill p-b">'+d+' días</span>';
}

async function cargar() {
  if (!sb) { document.getElementById('tabla').innerHTML = '<div class="empty">Sin conexión con Supabase</div>'; return; }
  const desde = sumaDias(hoyISO(), -120);
  const [liq, imp, log] = await Promise.all([
    sb.from('aeat_liquidaciones').select('*').gte('fecha_limite', desde).order('fecha_limite').order('justificante'),
    sb.from('aeat_importadores').select('nif,nombre'),
    sb.from('aeat_sync_log').select('*').order('created_at', {ascending:false}).limit(1)
  ]);
  if (liq.error) {
    document.getElementById('tabla').innerHTML = '<div class="empty">Error: '+esc(liq.error.message)+
      '<br><small>¿Se ha ejecutado supabase_liquidaciones.sql?</small></div>';
    return;
  }
  filas = liq.data || [];
  nombres = {}; (imp.data||[]).forEach(r => nombres[r.nif] = r.nombre);
  pintarSync((log.data||[])[0]);
  pintar();
}

function pintarSync(l) {
  const el = document.getElementById('sync');
  if (!l) { el.textContent = 'Aún no hay consultas del servidor'; el.className = 'sync err'; return; }
  const t = new Date(l.created_at), horas = (Date.now() - t) / 36e5;
  const cuando = t.toLocaleString('es-ES', {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  if (!l.ok) { el.textContent = '⚠ Última consulta AEAT FALLIDA (' + cuando + ')'; el.className = 'sync err'; el.title = l.error || ''; }
  else if (horas > 80) { el.textContent = '⚠ Sin datos nuevos desde ' + cuando; el.className = 'sync err'; }
  else { el.textContent = 'Consultado en la AEAT: ' + cuando; el.className = 'sync'; }
}

function pintar() {
  const h = hoyISO(), [si, sf] = periodo();
  const vivas = filas.filter(viva);
  const venc = vivas.filter(f => f.fecha_limite < h);
  const sem = vivas.filter(f => f.fecha_limite >= si && f.fecha_limite <= sf);
  const nHoy = sem.filter(f => f.fecha_limite === h).length;
  const sum = a => a.reduce((s,f) => s + Number(f.importe||0), 0);
  document.getElementById('kpis').innerHTML =
    '<div class="kpi rd"><div class="l">Vencidas sin pagar</div><div class="v">'+eur(sum(venc))+'</div><div class="s">'+venc.length+' liquidaciones</div></div>'+
    '<div class="kpi am"><div class="l">Próximos '+DIAS_AVISO+' días (hoy a '+DIAS[new Date(sf+'T12:00:00').getDay()]+' '+fmt(sf).slice(0,5)+')</div><div class="v">'+eur(sum(sem))+'</div><div class="s">'+sem.length+' liquidaciones'+(nHoy ? ' · <b style="color:var(--rd600)">'+nHoy+' vence(n) hoy</b>' : '')+'</div></div>'+
    '<div class="kpi b"><div class="l">Total pendiente</div><div class="v">'+eur(sum(vivas))+'</div><div class="s">'+vivas.length+' liquidaciones</div></div>';

  let lista = filtro === 'pend' ? vivas : filtro === 'semana' ? venc.concat(sem) : filas;
  if (!lista.length) { document.getElementById('tabla').innerHTML = '<div class="empty">No hay liquidaciones en esta vista 🎉</div>'; return; }

  let html = '<table><thead><tr><th>Vence</th><th>Estado</th><th>Justificante</th><th>Documento</th><th>Importador</th><th class="r">Importe</th><th>MRN</th><th></th></tr></thead><tbody>';
  let grupoPrevio = '';
  lista.forEach(f => {
    const g = !viva(f) ? 'Pagadas / fuera de pendientes' : f.fecha_limite < h ? 'Vencidas sin pagar' :
              f.fecha_limite <= sf ? 'Próximos '+DIAS_AVISO+' días' : 'Más adelante';
    if (g !== grupoPrevio) { html += '<tr class="grp"><td colspan="8">'+g+'</td></tr>'; grupoPrevio = g; }
    const dow = DIAS[new Date(f.fecha_limite+'T12:00:00').getDay()];
    const nom = nombres[f.importador];
    html += '<tr class="'+(viva(f)?'':'done')+'">'+
      '<td><b>'+dow+' '+fmt(f.fecha_limite)+'</b></td>'+
      '<td>'+estado(f)+'</td>'+
      '<td class="m">'+(urlLiq(f)
          ? '<a href="'+esc(urlLiq(f))+'" target="_blank" rel="noopener" title="Abrir la liquidación en la Sede AEAT">'+esc(f.justificante)+' ↗</a>'
          : esc(f.justificante))+'</td>'+
      '<td class="m">'+esc(f.documento)+'</td>'+
      '<td><span class="m">'+esc(f.importador)+'</span>'+
        (nom ? '<span class="imp-n">'+esc(nom)+' <span class="link" data-nif="'+esc(f.importador)+'">editar</span></span>'
             : '<span class="imp-n link" data-nif="'+esc(f.importador)+'">+ poner nombre</span>')+'</td>'+
      '<td class="r"><b>'+eur(f.importe)+'</b></td>'+
      '<td class="m">'+esc(f.mrn)+'</td>'+
      '<td>'+(f.pagada_manual
          ? '<button class="btn btn-sec" data-desmarcar="'+esc(f.justificante)+'" title="'+esc((f.pagada_por||'')+' · '+(f.pagada_en?new Date(f.pagada_en).toLocaleString('es-ES'):''))+'">Deshacer</button>'
          : (f.estado_aeat==='pendiente' ? '<button class="btn btn-ok" data-pagar="'+esc(f.justificante)+'">✓ Pagada</button>' : ''))+'</td>'+
      '</tr>';
  });
  document.getElementById('tabla').innerHTML = html + '</tbody></table>';
}

document.getElementById('tabla').addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.pagar) modalPagar(t.dataset.pagar);
  else if (t.dataset.desmarcar) marcar(t.dataset.desmarcar, false);
  else if (t.dataset.nif) modalNombre(t.dataset.nif);
});
document.getElementById('seg').addEventListener('click', e => {
  const f = e.target.dataset.f; if (!f) return;
  filtro = f;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  pintar();
});

function cerrarModal() { document.getElementById('modal-root').innerHTML = ''; }
window.cerrarModal = cerrarModal;

function modal(titulo, cuerpo, onOk, txtOk) {
  document.getElementById('modal-root').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)cerrarModal()"><div class="modal" onclick="event.stopPropagation()">'+
    '<div class="mhdr"><h2>'+titulo+'</h2><button onclick="cerrarModal()">&times;</button></div>'+
    '<div class="mbody">'+cuerpo+'</div>'+
    '<div class="mfoot"><button class="btn btn-sec" onclick="cerrarModal()">Cancelar</button><button class="btn btn-primary" id="m-ok">'+txtOk+'</button></div></div></div>';
  document.getElementById('m-ok').onclick = onOk;
}

function modalPagar(j) {
  const f = filas.find(x => x.justificante === j); if (!f) return;
  modal('Marcar como pagada',
    '<div>Justificante <b class="m">'+esc(j)+'</b><br>'+esc(f.documento)+' · <b>'+eur(f.importe)+'</b> · vence '+fmt(f.fecha_limite)+'</div>'+
    '<label>Nota (opcional)</label><textarea id="m-nota" rows="2" placeholder="Fecha de pago, NRC…">'+esc(f.notas||'')+'</textarea>'+
    '<div style="font-size:12px;color:var(--g600)">Deja de salir en el email y en pendientes aunque la AEAT tarde en actualizarla.</div>',
    () => marcar(j, true, document.getElementById('m-nota').value), '✓ Marcar pagada');
}

async function marcar(j, pagada, nota) {
  const upd = pagada
    ? {pagada_manual:true, pagada_por:(CU && CU.nombre)||'', pagada_en:new Date().toISOString(), notas:nota||null}
    : {pagada_manual:false, pagada_por:null, pagada_en:null};
  const {error} = await sb.from('aeat_liquidaciones').update(upd).eq('justificante', j);
  if (error) { alert('Error: ' + error.message); return; }
  cerrarModal(); cargar();
}

function modalNombre(nif) {
  modal('Nombre del importador',
    '<label>NIF</label><input value="'+esc(nif)+'" disabled class="m">'+
    '<label>Nombre (se usa también en el email)</label><input id="m-nom" value="'+esc(nombres[nif]||'')+'" autofocus>',
    async () => {
      const nombre = document.getElementById('m-nom').value.trim(); if (!nombre) return;
      const {error} = await sb.from('aeat_importadores').upsert({nif, nombre});
      if (error) { alert('Error: ' + error.message); return; }
      cerrarModal(); cargar();
    }, 'Guardar');
}

window.cargar = cargar;
cargar();
}
</script>
</body>
</html>
