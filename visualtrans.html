<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Customs Way · Ficheros VisualTrans</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function(){
  var saved=localStorage.getItem('als_dark');
  var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  if(saved==='1'||(saved===null&&prefersDark)) document.documentElement.classList.add('dark');
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --w:#fff;--g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;--g300:#cbd5e1;
  --g400:#94a3b8;--g500:#64748b;--g600:#475569;--g700:#334155;--g900:#0f172a;
  --b50:#eff6ff;--b100:#dbeafe;--b500:#3b82f6;--b600:#2563eb;--b700:#1d4ed8;
  --gr50:#f0fdf4;--gr500:#22c55e;--gr600:#16a34a;
  --am50:#fffbeb;--am500:#f59e0b;--am600:#d97706;
  --rd50:#fff1f2;--rd500:#f43f5e;--rd600:#e11d48;
  --tl50:#f0fdfa;--tl500:#14b8a6;--tl600:#0d9488;
  --pu50:#faf5ff;--pu500:#a855f7;--pu600:#9333ea;
  --or50:#fff7ed;--or500:#f97316;--or600:#ea580c;
  --f:'IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --r:8px;--rl:12px;--rxl:18px;
  --sh0:0 1px 3px rgba(0,0,0,.07);
  --shl:0 8px 32px rgba(0,0,0,.12);
  --shxl:0 24px 64px rgba(0,0,0,.16);
  --hh:58px;--sw:240px;
}
:root.dark{
  --w:#0f172a;--g50:#1e293b;--g100:#1e293b;--g200:#334155;--g300:#475569;
  --g400:#64748b;--g500:#94a3b8;--g600:#cbd5e1;--g700:#e2e8f0;--g900:#f8fafc;
  --b50:#1e3a5f;--b100:#1e3a8a;--b500:#60a5fa;--b600:#3b82f6;
  --gr50:#052e16;--gr500:#4ade80;--gr600:#22c55e;
  --am50:#451a03;--am500:#fbbf24;--am600:#f59e0b;
  --rd50:#4c0519;--rd500:#fb7185;--rd600:#f43f5e;
  --tl50:#042f2e;--tl500:#2dd4bf;--tl600:#14b8a6;
  --pu50:#3b0764;--pu500:#c084fc;--pu600:#a855f7;
  --or50:#431407;--or500:#fb923c;--or600:#f97316;
  --shl:0 8px 32px rgba(0,0,0,.5);
}
html,body{height:100%;background:var(--g50);color:var(--g900);font-family:var(--f);font-size:14px}
:root.dark body{background:#0a0f1e}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--f);border:none;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-p{background:linear-gradient(135deg,#0f2d6e,#1d4ed8);color:#fff;box-shadow:0 2px 8px rgba(15,45,110,.3)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(15,45,110,.4)}
.btn-s{background:var(--g100);color:var(--g700);border:1px solid var(--g200)}
.btn-s:hover{background:var(--g200)}
.btn-sm{padding:5px 10px;font-size:12px}
.fi{
  width:100%;padding:10px 14px;border-radius:var(--r);
  border:1.5px solid var(--g200);background:var(--w);
  color:var(--g900);font-family:var(--f);font-size:13px;
  transition:border-color .15s,box-shadow .15s;outline:none;
}
.fi:focus{border-color:var(--b600);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
:root.dark .fi{background:#1e293b!important;border-color:#334155!important;color:var(--g900)!important}
:root.dark .fi:focus{border-color:var(--b600)!important}
.card{background:var(--w);border:1px solid var(--g200);border-radius:var(--rl);padding:20px;box-shadow:var(--sh0)}
:root.dark .card{background:#0f172a!important;border-color:#334155!important}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:9px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);background:var(--g50);border-bottom:1px solid var(--g200);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--g100);color:var(--g700);vertical-align:top}
:root.dark .tbl th{background:#1a2744!important;color:var(--g500)!important;border-color:#334155!important}
:root.dark .tbl td{background:#0f172a!important;border-color:#1e293b!important;color:var(--g600)!important}
:root.dark .tbl tr:hover td{background:#1e293b!important}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#0f172a;color:#fff;padding:10px 20px;border-radius:10px;
  font-size:13px;font-weight:500;z-index:9999;opacity:0;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ph{background:var(--w);border-bottom:1px solid var(--g200);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0;position:sticky;top:0;z-index:10}
:root.dark .ph{background:#0f172a!important;border-color:#334155!important}
.pt{font-size:16px;font-weight:700;color:var(--g900)}
.ps{font-size:12px;color:var(--g500);margin-top:2px}
.view-body{padding:20px 24px;flex:1}
html,body{height:auto;min-height:100%}
</style>
</head>
<body>
<div id="pg-header-app"></div>
<div class="ph">
  <div>
    <div class="pt">🚢 Ficheros VisualTrans</div>
    <div class="ps">Un expediente por operación: exportación + T2GI, H1, T1GI y reexportación. Las facturas llegan del clasificador con su SOIVRE; también se puede partir de una G4.</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <a class="btn btn-s btn-sm" href="taric.html" style="text-decoration:none">Clasificador TARIC</a>
    <button class="btn btn-p btn-sm" onclick="duaNuevoG4()">+ Nuevo desde G4</button>
  </div>
</div>
<div class="view-body">
  <div id="dua-expediente"></div>
  <div class="card" style="padding:12px 14px"><div style="font-size:13px;font-weight:700;color:var(--g700);margin-bottom:8px">Expedientes</div><div id="dua-lista"></div></div>
</div>
<div id="toast"></div>

<script src="auth-guard.js"></script>
<script src="vt-filas.js?v=2026110710"></script>
<script src="vt-entidades.js?v=2026110220"></script>
<script src="vt-modulo.js?v=2026110710"></script>
<script>
'use strict';
// Del clasificador lee el catálogo y recibe las facturas; de SOIVRE, los N003.
// Mismos permisos que el clasificador.
function sbT(){ return PortalGuard.sb; }
function sEsc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function showToast(msg, dur = 3500){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}
(async function init(){
  const ok = await PortalGuard.require('taric');
  if(!ok) return;
  try { PortalGuard.mountHeader({mount:'#pg-header-app', module:'Aduanas', section:'Ficheros VisualTrans'}); } catch(e) {}
  loadVisualTrans();
})();
</script>
</body>
</html>
