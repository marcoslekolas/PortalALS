<script>
/* ===== Núcleo RMT: lectura de PDF y parseo de TAD (T1/T2/T2GI…) y DUA levante (IM/EX…) ===== */

// Extrae cada página como filas [{y, cells:[{x,s}], text}] ordenadas de arriba abajo
async function pdfRows(pdfjsLib, data) {
  const doc = await pdfjsLib.getDocument({ data, verbosity: 0 }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4];
      let r = rows.find(r => Math.abs(r.y - y) < 2.5);
      if (!r) { r = { y, cells: [] }; rows.push(r); }
      r.cells.push({ x, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y);
    rows.forEach(r => {
      r.cells.sort((a, b) => a.x - b.x);
      r.text = r.cells.map(c => c.s.trim()).join(' | ');
    });
    pages.push(rows);
  }
  return pages;
}

// Números en formato AEAT: "1.400" = 1400 ; "1.400,5" = 1400.5 ; "20500" ; "308.60" = 308.6
function parseNum(v) {
  if (v == null) return null;
  v = String(v).trim();
  if (!v) return null;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) return parseFloat(v.replace(/\./g, '').replace(',', '.'));
  if (/^\d+,\d+$/.test(v)) return parseFloat(v.replace(',', '.'));
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

const RE_MRN = /\b\d{2}[A-Z]{2}[A-Z0-9]{14}\b/;
const RE_CSV = /C\.S\.V\.\s*\|\s*([A-Z0-9]{16})\b/;
const RE_DOCCODE = /^([A-Z]\d{3}|\d{4})\s/;   // N830 …, 7020 …, C672 …

function idxOf(rows, re) { return rows.findIndex(r => re.test(r.text)); }
function lastCells(row, n) { const c = row.cells.map(c => c.s.trim()); return c.slice(-n); }

function detectType(pages) {
  const all = pages[0].map(r => r.text).join('\n');
  if (/DOCUMENTO DE LEVANTE EN ADUANA DE EXPORTACI/i.test(all)) return 'DUE';
  if (/TRANSIT ACCOMPANYING DOCUMENT|Type \[11 01\]/.test(all)) return 'TAD';
  if (/TIPO DE DECLARACI|Importador|Exportador|Fecha de Levante/i.test(all)) return 'DUA';
  return null;
}

/* ---------- Ubicaciones que se despachan con el impreso ANEXO 3 (Cernaval / Campamento) ---------- */
const ADUANA_CERNAVAL = 'ES001165';
const UBIC_CERNAVAL = '1165OOLL03';

function esCernaval(d) {
  return !!d && (String(d.aduanaSalida || '').toUpperCase() === ADUANA_CERNAVAL ||
                 String(d.ubicacion || '').toUpperCase() === UBIC_CERNAVAL);
}

/* ---------- Documento de levante en aduana de exportación (DUE) ---------- */
function parseDUE(pages) {
  const w = [];
  const txt = pages.map(rs => rs.map(r => r.text).join('\n')).join('\n');
  const out = { familia: 'DUE', tipo: 'DUE' };

  out.mrn = (txt.match(/MRN de exportaci[^:]*:\s*\|?\s*([A-Z0-9]{18})/i) || [])[1] ||
            (txt.match(RE_MRN) || [])[0] || '';
  out.csv = (txt.match(RE_CSV) || [])[1] || '';

  out.aduanaSalida = (txt.match(/Aduana de Salida:\s*\|\s*([A-Z]{2}\d{6})/i) || [])[1] || '';
  out.ubicacion = (txt.match(/Ubicaci[^|]*en Aduana de Exportaci[^|]*\|\s*(\S+)/i) || [])[1] || '';

  // Buque: el "Identificador" que sigue a "Tipo de identificación: 11 Nombre del buque marítimo"
  const mb = txt.match(/Tipo de identificaci[^\n]*\n(?:[^\n]*\n)??\s*Identificador:\s*\|\s*([^|\n]+)/i);
  out.buque = mb ? mb[1].trim().replace(/\s+/g, ' ') : '';
  if (!out.buque) w.push('No se encontró el nombre del buque');

  out.peso = parseNum((txt.match(/Masa Bruta total:\s*\|\s*([\d.,]+)/i) || [])[1]);
  out.bultos = parseNum((txt.match(/N[ºo°] de embalajes:\s*\|\s*(\d+)/i) || [])[1]);
  out.tipoBulto = (txt.match(/Tipo de embalaje:\s*\|\s*([A-Z0-9]{2})\b/i) || [])[1] || '';

  out.levante = (txt.match(/Fecha de Levante[^|]*\|\s*(\d{2}-\d{2}-\d{4})/i) || [])[1] || '';
  out.cir = out.levante ? 'Verde' : '';
  if (!out.levante) w.push('No aparece fecha de levante: revisa el CIR');

  const md = txt.match(/Descripci[^|]*de la mercanc[^|]*\|\s*([\s\S]*?)\n(?:Posici[oó]n|Masa|Embalajes|Tipo:)/i);
  out.descripcion = md ? md[1].replace(/\s*\|\s*/g, ' ').replace(/\s+/g, ' ').trim() : '';
  if (!out.descripcion) w.push('No se encontró la descripción de la partida 1');

  out.matricula = '';
  out.avisos = w;
  return out;
}

/* ---------- TAD: T1 / T2 / T2GI / T1GI / T2F … ---------- */
function parseTAD(pages) {
  const p1 = pages[0], w = [];
  const txt = p1.map(r => r.text).join('\n');
  const out = { familia: 'TAD' };

  const it = idxOf(p1, /Type \[11 01\]/);
  out.tipo = it >= 0 && p1[it + 1] ? p1[it + 1].cells[0].s.trim() : '';
  if (!/^T/.test(out.tipo)) { const m = txt.match(/\b(T1GI|T2GI|T2F|T2L|T1|T2)\b/); out.tipo = m ? m[1] : ''; }

  const mm = txt.match(RE_MRN); out.mrn = mm ? mm[0] : '';

  const iTot = idxOf(p1, /Total packages/);
  if (iTot >= 0 && p1[iTot + 1]) {
    const [pk, gm] = lastCells(p1[iTot + 1], 3); // packages | gross | security
    out.bultos = parseNum(pk); out.peso = parseNum(gm);
  }

  const mp = txt.match(/^(\d{1,2})\s*-\s*([A-Z0-9]{4,12})\s*-\s*[A-Z]{2}$/m);
  out.matricula = mp ? mp[2] : '';

  const mr = txt.match(/Result:\s*\|\s*([AB]\d)\s*([^|\n]*)/);
  out.resultado = mr ? (mr[1] + ' ' + mr[2]).trim() : '';
  out.cir = mr && /^A[12]$/.test(mr[1]) ? 'Verde' : '';
  if (!out.cir) w.push('Resultado de control no conforme o no encontrado: revisa el CIR');

  const mc = txt.match(RE_CSV); out.csv = mc ? mc[1] : '';

  // Primera partida (lista de partidas, normalmente página 2; si no, página 1)
  out.descripcion = ''; out.tipoBulto = '';
  for (const rows of pages) {
    const i0 = rows.findIndex(r => /^0*1 \| 0*1 \|/.test(r.text) && r.cells.length >= 3);
    if (i0 < 0) continue;
    const descX = rows[i0].cells[2].x;
    const partes = [];
    for (let i = i0; i < rows.length; i++) {
      if (i > i0 && /^\d{5} \| \d{5}/.test(rows[i].text)) break;
      if (!out.tipoBulto && i <= i0 + 2) {
        const mb = rows[i].text.match(/\|\s*\d+\s*\|\s*([A-Z0-9]{2})\s+[A-ZÁÉÍÓÚÑ]{2,}/);
        if (mb) out.tipoBulto = mb[1];
      }
      const c = rows[i].cells.find(c => Math.abs(c.x - descX) < 4);
      if (!c) continue;
      if (RE_DOCCODE.test(c.s.trim()) && i > i0) break;
      partes.push(c.s);
    }
    // Las líneas de la AEAT se cortan a 58 caracteres: si la línea llena el ancho, se une sin espacio
    let d = '';
    partes.forEach((s, i) => { d += (i === 0 ? '' : (partes[i - 1].length >= 58 ? '' : ' ')) + s.trim(); });
    out.descripcion = d.replace(/\s+/g, ' ').trim();
    break;
  }
  if (!out.descripcion) w.push('No se encontró la descripción de la partida 1');
  if (!out.tipoBulto) w.push('No se encontró el tipo de bulto');
  out.avisos = w;
  return out;
}

/* ---------- DUA con levante: IM / EX / CO … ---------- */
function parseDUA(pages) {
  const p1 = pages[0], w = [];
  const txt = pages.map(rs => rs.map(r => r.text).join('\n')).join('\n');
  const out = { familia: 'DUA' };

  const mt = txt.match(/^(IM|EX|CO|EU)\s*\|\s*[A-Z]\b/m); out.tipo = mt ? mt[1] : 'IM';
  const mm = txt.match(RE_MRN); out.mrn = mm ? mm[0] : '';

  const iM = idxOf(p1, /Total Masa/);
  if (iM >= 0) {
    for (let k = 1; k <= 3 && p1[iM + k]; k++) {
      if (/^[\d | .,]+$/.test(p1[iM + k].text)) { out.peso = parseNum(lastCells(p1[iM + k], 1)[0]); break; }
    }
  }
  const iB = idxOf(p1, /Total Bultos/);
  if (iB >= 0) {
    for (let k = 1; k <= 3 && p1[iB + k]; k++) {
      if (/^\d+ \| \d+$/.test(p1[iB + k].text)) { out.bultos = parseNum(lastCells(p1[iB + k], 1)[0]); break; }
    }
  }

  const iT = idxOf(p1, /Identificador del Medio de Transporte/);
  out.matricula = iT >= 0 && p1[iT + 1] ? p1[iT + 1].cells[0].s.trim().replace(/\s+/g, '') : '';

  out.levante = (txt.match(/Fecha de Levante\s*\|\s*(\d{2}-\d{2}-\d{4})/) || [])[1] || '';
  out.cir = out.levante ? 'Verde' : '';
  if (!out.levante) w.push('No aparece fecha de levante: revisa el CIR');

  const mc = txt.match(RE_CSV); out.csv = mc ? mc[1] : '';

  out.descripcion = ''; out.tipoBulto = '';
  const i0 = idxOf(p1, /^0*1$/);
  if (i0 >= 0) {
    const mb = p1[i0 + 1] && p1[i0 + 1].text.match(/\|\s*([A-Z0-9]{2})$/);
    if (mb) out.tipoBulto = mb[1];
    const partes = [];
    for (let i = i0 + 3; i < p1.length; i++) {
      if (RE_DOCCODE.test(p1[i].cells[0].s.trim() + ' ')) break;
      if (/^Control por la Aduana/.test(p1[i].text)) break;
      partes.push(p1[i].cells.map(c => c.s.trim()).join(' '));
    }
    out.descripcion = partes.join(' ').replace(/\s+/g, ' ').trim();
  }
  if (!out.descripcion) w.push('No se encontró la descripción de la partida 1');
  out.avisos = w;
  return out;
}

async function parseDoc(pdfjsLib, data, nombre) {
  const pages = await pdfRows(pdfjsLib, data);
  const tipo = detectType(pages);
  let d;
  if (tipo === 'TAD') d = parseTAD(pages);
  else if (tipo === 'DUE') d = parseDUE(pages);
  else if (tipo === 'DUA') d = parseDUA(pages);
  else return { fichero: nombre, error: 'No es un documento de la AEAT reconocible (¿escaneado o ya es una RMT?)' };
  d.fichero = nombre;
  if (!d.mrn) d.avisos.push('No se encontró el MRN');
  if (!d.csv) d.avisos.push('No se encontró el CSV');
  if (d.peso == null) d.avisos.push('No se encontró el peso bruto');
  if (d.bultos == null) d.avisos.push('No se encontró el nº de bultos');
  return d;
}

if (typeof module !== 'undefined') module.exports = { parseDoc, parseNum, esCernaval };

</script>

/* ===== Impreso ANEXO 3 — RMT suministro en campamento (Cernaval) =====
   Reproduce el impreso oficial de la AEAT · Delegación de Cádiz en jsPDF.
   Medidas en puntos, tomadas del impreso original (A4 = 595,3 x 841,9 pt). */

const A3_FILAS = 13;                       // líneas de la tabla de carga por hoja
const A3_COLS = [64.9, 91.7, 127.1, 240.5, 283.1, 318.6, 354.0, 446.1, 531.3];
const A3_CAB = ['Nº ORDEN', 'TIPO DOC', 'M   R   N', 'CIRCUITO', 'Nº BULTOS', 'PESO BRUTO', 'C S V', 'O B S'];
const A3_Y0 = 408.4;                       // borde superior de la primera línea
const A3_H = 12.57;                        // alto de línea
const A3_DEP = ['Dependencia de Aduanas de', 'Algeciras', '', 'Aduana de La línea'];

function a3Texto(doc, x, y, s, size, bold, align) {
  doc.setFont('helvetica', bold ? 'bold' : 'normal').setFontSize(size);
  doc.text(String(s == null ? '' : s), x, y, align ? { align: align } : undefined);
}

// Recorta el texto al ancho disponible de la celda
function a3Cabe(doc, s, size, bold, ancho) {
  doc.setFont('helvetica', bold ? 'bold' : 'normal').setFontSize(size);
  s = String(s == null ? '' : s);
  if (doc.getTextWidth(s) <= ancho) return s;
  while (s.length > 1 && doc.getTextWidth(s + '…') > ancho) s = s.slice(0, -1);
  return s + '…';
}

// Mayor cuerpo con el que el texto cabe entero en el ancho dado
function a3Ajustar(doc, s, bold, ancho, max, min) {
  doc.setFont('helvetica', bold ? 'bold' : 'normal');
  for (let size = max; size > min; size -= 0.25) {
    doc.setFontSize(size);
    if (doc.getTextWidth(String(s)) <= ancho) return size;
  }
  return min;
}

function a3Encabezado(doc, IMG_AEAT) {
  doc.addImage(IMG_AEAT, 'PNG', 67.2, 20.2, 117.5, 53.0);
  doc.setDrawColor(0).setLineWidth(0.6);
  doc.line(66.5, 73.5, 548.9, 73.5);
  a3Texto(doc, 452.3, 69.5, 'Delegación de CADIZ', 10, false);
}

/* Hoja 1 — datos de la carga. Una por cada bloque de 13 documentos. */
function a3Hoja1(doc, opts, docs, hoja, hojas) {
  a3Encabezado(doc, opts.IMG_AEAT);

  a3Texto(doc, 70, 118.5, 'ANEXO 3', 11, true);
  a3Texto(doc, 70, 140, 'RMT SUMINSITRO EN CAMPAMENTO', 11, true);
  a3Texto(doc, 70, 162, 'NOTA: Este impreso se presentará acompañado de copia de la documentación que se', 11, false);
  a3Texto(doc, 70, 175.3, 'relaciona en el apartado 1.', 11, false);

  // ── Cuadro de cabecera ────────────────────────────────────────────────
  const x0 = 70.5, x1 = 183.9, x2 = 399.8, x3 = 531.3, yA = 187.5, yB = 274.2, yC = 317.6;
  doc.setFillColor(217, 217, 217);
  doc.rect(x0, yA, x1 - x0, yC - yA, 'F');            // columna izquierda
  doc.rect(x2, yA, x3 - x2, yC - yA, 'F');            // columna derecha
  doc.setDrawColor(0).setLineWidth(0.9);
  doc.line(x0, yA, x3, yA); doc.line(x0, yC, x3, yC); doc.line(x0, yB, x2, yB);
  doc.line(x0, yA, x0, yC); doc.line(x1, yA, x1, yC);
  doc.line(x2, yA, x2, yC); doc.line(x3, yA, x3, yC);

  a3Texto(doc, 77.6, 238, 'RMT', 30, true);
  a3Texto(doc, 75.5, 294.5, 'CAMPAMENTO', 11, true);
  a3Texto(doc, 187.6, 197.5, A3_DEP[0], 11, false);
  a3Texto(doc, 187.6, 219, A3_DEP[1], 11, false);
  a3Texto(doc, 184.2, 241, a3Cabe(doc, opts.buque, 11, true, x2 - 186), 11, true);   // ← buque
  a3Texto(doc, 187.6, 262, A3_DEP[3], 11, false);
  a3Texto(doc, 184.4, 286.5, 'CARPETA Nº CS', 8, true);
  a3Texto(doc, 186.7, 306.5, 'Nota: Formato: CS – nº atraque', 8, false);
  a3Texto(doc, 400.3, 209, '(1)Nº RMT', 11, false);
  a3Texto(doc, 124, 327.5, '(1) Dato optativo', 11, false);
  if (hojas > 1) a3Texto(doc, 531.3, 182, 'Hoja ' + hoja + ' de ' + hojas, 9, false, 'right');

  // ── 1. Datos de la carga ──────────────────────────────────────────────
  a3Texto(doc, 70, 362, '1.- DATOS DE LA CARGA (A CUMPLIMENTAR POR EL PROVISIONISTA)', 11, true);
  doc.setLineWidth(0.6); doc.line(68.5, 367.1, 518.5, 367.1);

  // Cabecera de la tabla: fondo negro, texto blanco
  const yh = 395.6;
  doc.setFillColor(0, 0, 0).rect(A3_COLS[0], yh, A3_COLS[8] - A3_COLS[0], A3_Y0 - yh, 'F');
  doc.setTextColor(255, 255, 255);
  A3_CAB.forEach(function (t, i) {
    const cx = (A3_COLS[i] + A3_COLS[i + 1]) / 2;
    const size = a3Ajustar(doc, t, true, A3_COLS[i + 1] - A3_COLS[i] - 3, 8, 4.5);
    a3Texto(doc, cx, (yh + A3_Y0) / 2 + size * 0.36, t, size, true, 'center');
  });
  doc.setTextColor(0, 0, 0);

  // Rejilla
  doc.setLineWidth(0.6);
  for (let r = 0; r <= A3_FILAS; r++) {
    const y = A3_Y0 + r * A3_H;
    doc.line(A3_COLS[0], y, A3_COLS[8], y);
  }
  const yFin = A3_Y0 + A3_FILAS * A3_H;
  A3_COLS.forEach(function (x) { doc.line(x, A3_Y0, x, yFin); });

  // Filas
  for (let r = 0; r < docs.length && r < A3_FILAS; r++) {
    const yTxt = A3_Y0 + r * A3_H + 8.8, d = docs[r];
    const celdas = [
      String(d.orden), d.tipo || '', d.mrn || '', (d.cir || '').charAt(0),
      d.bultos == null ? '' : String(d.bultos), d.peso == null ? '' : String(d.peso), d.csv || '', d.obs || ''
    ];
    celdas.forEach(function (t, i) {
      if (t === '') return;
      const ancho = A3_COLS[i + 1] - A3_COLS[i] - 4;
      a3Texto(doc, A3_COLS[i] + 2, yTxt, a3Cabe(doc, t, 8, false, ancho), 8, false);
    });
  }

  // "Cruce las líneas no utilizadas invalidándolas." — una diagonal sobre todo el bloque libre
  if (opts.cruzar && docs.length < A3_FILAS) {
    const yLibre = A3_Y0 + docs.length * A3_H;
    doc.setLineWidth(0.8);
    doc.line(A3_COLS[0] + 1, yLibre + 1, A3_COLS[8] - 1, yFin - 1);
    doc.setLineWidth(0.6);
  }

  a3Texto(doc, 70, 581.5, 'Nota: El número de orden deberá constar en la documentación adjunta a la RMT.', 11, true);
  a3Texto(doc, 70, 594.9, 'Cruce las líneas no utilizadas invalidándolas.', 11, true);
  a3Texto(doc, 70, 638.2, 'FIRMA Y SELLO DEL PROVISIONISTA', 11, true);

  // Recuadros de firma y sello + sello ALS encima del de firma (como el impreso original)
  doc.setLineWidth(0.9);
  doc.rect(129.2, 676.2, 253.4 - 129.2, 742.1 - 676.2);
  doc.rect(396.1, 676.2, 520.4 - 396.1, 742.1 - 676.2);
  doc.addImage(opts.IMG_SELLO, 'PNG', 99.9, 671.8, 160.3, 85.5);
  a3Texto(doc, 70, 756.6, 'Firma', 11, true);
  a3Texto(doc, 360, 756.6, 'Sello', 11, true);
}

  a3Texto(doc, 70, 163.3, 'En', 11, true);
  doc.line(87, 163.7, 218.3, 163.7);
  a3Texto(doc, 70, 206.6, 'Dia:', 11, true);
  a3Texto(doc, 142.7, 206.6, 'Hora', 11, true);
  a3Texto(doc, 201.6, 206.6, 'mes', 11, true);
  a3Texto(doc, 257.1, 206.6, 'año', 11, true);
  [[90.8, 142.6], [167.7, 201.4], [223.4, 256.9], [276.5, 346.9]].forEach(function (p) {
    doc.line(p[0], 207, p[1], 207);
  });
}

/* Construye el documento completo */
function a3Construir(jsPDFCtor, opts) {
  const doc = new jsPDFCtor({ orientation: 'portrait', unit: 'pt', format: 'a4' });
  const filas = opts.filas || [];
  const hojas = Math.max(1, Math.ceil(filas.length / A3_FILAS));
  for (let h = 0; h < hojas; h++) {
    if (h) doc.addPage();
    a3Hoja1(doc, opts, filas.slice(h * A3_FILAS, (h + 1) * A3_FILAS), h + 1, hojas);
  }
  doc.addPage(); a3Hoja2(doc, opts);
  doc.addPage(); a3Hoja3(doc, opts);
  return doc;
}

if (typeof module !== 'undefined') module.exports = { a3Construir, A3_FILAS };

<script>
// Guard: sesión Supabase vía PortalGuard + permiso DUA o TARIC (mismo criterio que el menú Aduanas)
(async function () {
  if (!window.PortalGuard) { document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">No se pudo cargar auth-guard.js</p>'; return; }
  const ok = await PortalGuard.require(null);
  if (!ok) return;
  if (!(PortalGuard.puedeAcceder('dua', 'ver') || PortalGuard.puedeAcceder('taric', 'ver'))) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#f8f9fa"><div style="text-align:center;padding:2rem">' +
      '<div style="font-size:48px;margin-bottom:12px">🔒</div><h2 style="margin-bottom:8px;color:#212529">Acceso denegado</h2>' +
      '<p style="color:#6c757d;margin-bottom:20px">No tienes permisos para el generador de RMT.</p>' +
      '<a href="index.html" style="background:#2563eb;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600">← Volver al portal</a></div></div>';
    return;
  }
  try { PortalGuard.mountHeader({ mount: '#pg-header-app', module: 'Aduanas', section: 'RMT' }); } catch (e) {}
  iniciarRMT();
})();

function iniciarRMT() {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

  const AGENCIA = '* ALGECIRAS LOGISTIC SOLUTIONS, S.L.';
  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // formato: 'embarque' = RMT de agrupación para embarque · 'cernaval' = impreso ANEXO 3 (suministro en campamento)
  const st = { docs: [], errores: [], formato: 'embarque', formatoTocado: false,
               clave: '', claveTocada: false, cruzar: true, fecha: hoyISO() };

  const drop = document.getElementById('drop'), file = document.getElementById('file');
  drop.addEventListener('click', () => file.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
  file.addEventListener('change', () => { cargar(file.files); file.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => cargar(e.dataTransfer.files));
  // Evitar que un PDF soltado fuera de la zona abra el visor del navegador
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function miles(n) { // 3100 -> "3.100" ; 1400,5 -> "1.400,5"
    if (n == null || isNaN(n)) return '';
    const [e, d] = String(Math.round(n * 100) / 100).split('.');
    return e.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + d : '');
  }
  function simple(n) { if (n == null || isNaN(n)) return ''; const r = Math.round(n * 100) / 100; return String(r).replace('.', ','); }

  // ── Formato y clave de agrupación (matrícula del camión o nombre del buque) ──
  const esCern = () => st.formato === 'cernaval';
  const etiqueta = () => esCern() ? 'Buque' : 'Matrícula';
  function claveDe(d) { return (esCern() ? d.buque : d.matricula) || ''; }
  function norm(v) {
    const s = String(v || '').toUpperCase().trim();
    return esCern() ? s.replace(/\s+/g, ' ') : s.replace(/[\s-]/g, '');
  }

  function detectarFormato() {
    if (st.formatoTocado || !st.docs.length) return;
    const cern = st.docs.filter(esCernaval).length;
    st.formato = cern > st.docs.length - cern ? 'cernaval' : 'embarque';
  }
  function encajaFormato(d) { return esCern() ? esCernaval(d) : !esCernaval(d); }
  function claveMayoritaria() {
    const c = {};
    st.docs.filter(encajaFormato).forEach(d => { const k = claveDe(d); if (k) c[k] = (c[k] || 0) + 1; });
    return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || '';
  }
  function aplicarFiltro() {
    const k = norm(st.clave);
    st.docs.forEach(d => {
      const dk = claveDe(d);
      d.incluido = encajaFormato(d) && (!k || !dk || norm(dk) === k);
    });
  }
  function recalcular() { detectarFormato(); if (!st.claveTocada) st.clave = claveMayoritaria(); aplicarFiltro(); }
  function incluidos() { return st.docs.filter(d => d.incluido); }

  async function cargar(files) {
    const pdfs = [...files].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
    if (!pdfs.length) return;
    const busy = document.getElementById('busy');
    busy.hidden = false;
    for (let i = 0; i < pdfs.length; i++) {
      busy.textContent = 'Leyendo ' + pdfs[i].name + ' (' + (i + 1) + ' de ' + pdfs.length + ')';
      try {
        const d = await parseDoc(pdfjsLib, new Uint8Array(await pdfs[i].arrayBuffer()), pdfs[i].name);
        if (d.error) { st.errores.push(d); continue; }
        if (d.mrn && st.docs.some(x => x.mrn === d.mrn)) { st.errores.push({ fichero: d.fichero, error: 'MRN ' + d.mrn + ' ya estaba cargado' }); continue; }
        d.incluido = true; d.obs = '';
        st.docs.push(d);
      } catch (err) {
        console.error(err);
        st.errores.push({ fichero: pdfs[i].name, error: 'No se pudo leer el PDF (' + err.message + ')' });
      }
    }
    busy.hidden = true;
    st.docs.sort((a, b) => (a.mrn || '').localeCompare(b.mrn || ''));
    recalcular();
    render();
  }

  function render() { renderDocs(); renderSide(); }

  function renderDocs() {
    const el = document.getElementById('docs');
    document.getElementById('docs-title').textContent = st.docs.length ? 'Documentos (' + incluidos().length + ' de ' + st.docs.length + ' en la RMT)' : 'Documentos';
    let h = '';
    if (st.errores.length) {
      h += '<div style="padding:10px 16px 0">' + st.errores.map((e, i) =>
        '<div class="note warn" style="margin-bottom:6px;display:flex;justify-content:space-between;gap:8px"><span><b>' + esc(e.fichero) + ':</b> ' + esc(e.error) + '</span><button class="x" data-err="' + i + '" aria-label="Descartar">&times;</button></div>').join('') + '</div>';
    }
    if (!st.docs.length) { el.innerHTML = h + '<div class="empty">Añade los justificantes para empezar.</div>'; bindDocs(el); return; }
    h += '<table class="docs"><thead><tr><th></th><th>Tipo</th><th>MRN / CSV</th><th>' + etiqueta() + '</th><th>CIR</th>' +
      '<th style="min-width:200px">Mercancía</th><th class="num">Bultos</th><th>Tipo</th><th class="num">P. bruto</th>' +
      (esCern() ? '<th>Obs.</th>' : '') + '<th></th></tr></thead><tbody>';
    st.docs.forEach((d, i) => {
      const k = claveDe(d);
      const otroImpreso = !encajaFormato(d);
      const distinta = !otroImpreso && st.clave && k && norm(k) !== norm(st.clave);
      h += '<tr class="' + (d.incluido ? '' : 'off') + '">' +
        '<td><input type="checkbox" data-i="' + i + '" data-k="incluido" ' + (d.incluido ? 'checked' : '') + ' aria-label="Incluir en la RMT"></td>' +
        '<td><span class="pill">' + esc(d.tipo) + '</span></td>' +
        '<td class="mono">' + esc(d.mrn) + '<br><span style="color:var(--g600)">' + esc(d.csv) + '</span></td>' +
        '<td class="mono">' + (otroImpreso ? '<span class="pill err">Otro impreso</span>' :
          distinta ? '<span class="pill warn mono">' + esc(k) + '</span>' : esc(k || '—')) + '</td>' +
        '<td><select data-i="' + i + '" data-k="cir" style="min-width:86px">' + ['', 'Verde', 'Naranja', 'Rojo'].map(o => '<option ' + (d.cir === o ? 'selected' : '') + '>' + o + '</option>').join('') + '</select></td>' +
        '<td><input type="text" data-i="' + i + '" data-k="descripcion" value="' + esc(d.descripcion) + '" title="' + esc(d.descripcion) + '"></td>' +
        '<td><input type="number" class="num" min="0" data-i="' + i + '" data-k="bultos" value="' + esc(d.bultos) + '" style="width:64px"></td>' +
        '<td><input type="text" class="mono" maxlength="2" data-i="' + i + '" data-k="tipoBulto" value="' + esc(d.tipoBulto) + '" style="width:44px;text-transform:uppercase"></td>' +
        '<td><input type="number" class="num" min="0" step="any" data-i="' + i + '" data-k="peso" value="' + esc(d.peso) + '" style="width:84px"></td>' +
        (esCern() ? '<td><input type="text" data-i="' + i + '" data-k="obs" value="' + esc(d.obs) + '" style="min-width:90px"></td>' : '') +
        '<td><button class="x" data-del="' + i + '" aria-label="Quitar ' + esc(d.mrn) + '">&times;</button></td></tr>';
      const avisos = d.avisos || [];
      if (avisos.length) h += '<tr class="avisos"><td></td><td colspan="10">' + avisos.map(esc).join(' · ') + '</td></tr>';
    });
    h += '</tbody></table>';
    el.innerHTML = h;
    bindDocs(el);
  }

  function bindDocs(el) {
    el.querySelectorAll('[data-k]').forEach(inp => inp.addEventListener('change', () => {
      const d = st.docs[+inp.dataset.i], k = inp.dataset.k;
      if (k === 'incluido') d.incluido = inp.checked;
      else if (k === 'bultos' || k === 'peso') d[k] = inp.value === '' ? null : parseFloat(inp.value);
      else if (k === 'tipoBulto') d[k] = inp.value.toUpperCase();
      else d[k] = inp.value;
      render();
    }));
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      st.docs.splice(+b.dataset.del, 1); recalcular(); render();
    }));
    el.querySelectorAll('[data-err]').forEach(b => b.addEventListener('click', () => { st.errores.splice(+b.dataset.err, 1); render(); }));
  }

  function renderSide() {
    const side = document.getElementById('side');
    const inc = incluidos();
    const claves = [...new Set(st.docs.filter(encajaFormato).map(claveDe).filter(Boolean))];
    const ajenos = st.docs.filter(d => !encajaFormato(d)).length;
    const sinCir = inc.filter(d => !d.cir).length;
    const bultos = inc.reduce((s, d) => s + (d.bultos || 0), 0);
    const peso = inc.reduce((s, d) => s + (d.peso || 0), 0);
    const cern = st.docs.filter(esCernaval).length;

    let aviso = '';
    if (claves.length > 1) aviso = '<div class="note warn">Hay documentos con ' + (esCern() ? 'buques distintos' : 'matrículas distintas') + ' (' + claves.map(esc).join(', ') + '). Solo entran en la RMT los del valor confirmado; puedes marcar otros a mano.</div>';
    else if (claves.length === 1 && norm(claves[0]) === norm(st.clave)) aviso = '<div class="note ok">Todos los documentos coinciden con este ' + etiqueta().toLowerCase() + '.</div>';
    if (sinCir) aviso += '<div class="note warn">' + sinCir + ' documento(s) sin CIR asignado.</div>';
    if (ajenos) aviso += '<div class="note warn">' + ajenos + ' documento(s) no corresponden a este impreso y quedan fuera. Cambia el impreso arriba si te interesan esos.</div>';
    if (esCern() && inc.length > A3_FILAS) aviso += '<div class="note warn">Más de ' + A3_FILAS + ' documentos: se reparten en varias hojas de carga.</div>';

    const opciones = [['embarque', 'RMT de embarque'], ['cernaval', 'ANEXO 3 · Suministro en campamento']];
    let h = '<div><label for="fmt">Impreso</label><select id="fmt" style="width:100%;padding:8px 10px;border:1px solid var(--g300);border-radius:var(--r)">' +
      opciones.map(o => '<option value="' + o[0] + '"' + (st.formato === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
    if (st.docs.length && !st.formatoTocado) {
      h += '<div style="font-size:12px;color:var(--g600);margin-top:5px">' +
        (esCern() ? 'Detectado por aduana ' + ADUANA_CERNAVAL + ' / ubicación ' + UBIC_CERNAVAL + '.' :
         (cern ? cern + ' documento(s) son de Cernaval.' : 'Ningún documento es de Cernaval.')) + '</div>';
    }
    h += '</div>';

    h += '<div><label for="mat">' + (esCern() ? 'Buque' : 'Matrícula del vehículo') + '</label>' +
      '<input id="mat" class="plate' + (esCern() ? ' ship' : '') + '" autocomplete="off" spellcheck="false" value="' + esc(st.clave) + '" placeholder="' + (esCern() ? 'NOMBRE DEL BUQUE' : '0000XXX') + '">' +
      (claves.length > 1 ? '<div class="chips" style="margin-top:8px">' + claves.map(p => '<button class="chip ' + (norm(p) === norm(st.clave) ? 'on' : '') + '" data-clave="' + esc(p) + '">' + esc(p) + '</button>').join('') + '</div>' : '') +
      '</div>' + aviso +
      '<div><label for="fec">Fecha de la RMT</label><input id="fec" type="date" value="' + esc(st.fecha) + '"></div>';

    if (esCern()) h += '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--g700);margin:0"><input type="checkbox" id="crz"' + (st.cruzar ? ' checked' : '') + '> Cruzar las líneas no utilizadas</label>';

    h += '<div><div class="tot"><span>Documentos</span><b>' + inc.length + '</b></div><div class="tot"><span>Bultos</span><b>' + bultos + '</b></div><div class="tot"><span>Peso bruto</span><b>' + miles(peso) + ' kg</b></div></div>';

    const listo = inc.length && st.clave.trim();
    if (esCern()) {
      h += '<button class="btn pri" id="gen" ' + (listo ? '' : 'disabled') + '>Imprimir RMT</button>' +
           '<button class="btn sec" id="pdf" ' + (listo ? '' : 'disabled') + '>Guardar PDF</button>';
    } else {
      h += '<button class="btn pri" id="gen" ' + (listo ? '' : 'disabled') + '>Confirmar matrícula y generar RMT</button>';
    }
    h += (st.docs.length ? '<button class="btn sec" id="clr">Empezar otra RMT</button>' : '');
    side.innerHTML = h;

    side.querySelector('#fmt').addEventListener('change', e => {
      st.formato = e.target.value; st.formatoTocado = true; st.claveTocada = false;
      st.clave = claveMayoritaria(); aplicarFiltro(); render();
    });
    const mat = side.querySelector('#mat');
    mat.addEventListener('input', () => { st.clave = mat.value.toUpperCase(); st.claveTocada = true; });
    mat.addEventListener('change', () => { aplicarFiltro(); render(); document.getElementById('mat').focus(); });
    side.querySelectorAll('[data-clave]').forEach(b => b.addEventListener('click', () => { st.clave = b.dataset.clave; st.claveTocada = true; aplicarFiltro(); render(); }));
    side.querySelector('#fec').addEventListener('change', e => { st.fecha = e.target.value || hoyISO(); });
    const crz = side.querySelector('#crz');
    if (crz) crz.addEventListener('change', e => { st.cruzar = e.target.checked; });
    side.querySelector('#gen').addEventListener('click', () => { confirmarClave(); esCern() ? imprimirCernaval() : generarEmbarque(); });
    const pdf = side.querySelector('#pdf');
    if (pdf) pdf.addEventListener('click', () => { confirmarClave(); guardarCernaval(); });
    const clr = side.querySelector('#clr');
    if (clr) clr.addEventListener('click', () => {
      st.docs = []; st.errores = []; st.clave = ''; st.claveTocada = false;
      st.formatoTocado = false; st.formato = 'embarque'; st.fecha = hoyISO(); render();
    });
  }

  function confirmarClave() {
    st.clave = norm(document.getElementById('mat').value);
    aplicarFiltro(); render();
  }

  // ── Impreso ANEXO 3 (Cernaval) ────────────────────────────────────────
  function nombreArchivo() {
    return 'RMT_' + (st.clave || 'SIN_BUQUE').replace(/[^A-Z0-9]+/gi, '_') + '_' + st.fecha + '.pdf';
  }
  function construirCernaval() {
    const ctor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    if (!ctor) { alert('No se pudo cargar jsPDF. Revisa la conexión y vuelve a intentarlo.'); return null; }
    const filas = incluidos().map((d, i) => ({
      orden: i + 1, tipo: d.tipo || '', mrn: d.mrn || '', cir: d.cir || '',
      bultos: d.bultos, peso: simple(d.peso), csv: d.csv || '', obs: d.obs || ''
    }));
    return a3Construir(ctor, { IMG_AEAT, IMG_SELLO, buque: st.clave, cruzar: st.cruzar, filas });
  }
  function guardarCernaval() {
    const doc = construirCernaval();
    if (doc) doc.save(nombreArchivo());
  }
  function imprimirCernaval() {
    const doc = construirCernaval();
    if (!doc) return;
    try {
      doc.autoPrint();
      const v = window.open(doc.output('bloburl'), '_blank');
      if (!v) doc.save(nombreArchivo());   // ventana emergente bloqueada: se descarga
    } catch (e) { doc.save(nombreArchivo()); }
  }

  // ── RMT de embarque (impresión HTML) ──────────────────────────────────
  function generarEmbarque() {
    const inc = incluidos();
    if (!inc.length) return;
    const [y, m, d] = st.fecha.split('-');
    const fLarga = (+d) + ' - ' + MESES[+m - 1] + ' - ' + y, fPie = (+d) + ' ' + MESES[+m - 1] + ' ' + y;
    const bultos = inc.reduce((s, x) => s + (x.bultos || 0), 0);
    const peso = inc.reduce((s, x) => s + (x.peso || 0), 0);
    const filas = inc.map((x, i) => '<tr><td class="r">' + String(i + 1).padStart(2, '0') + '</td><td>' + esc(x.tipo) + '</td><td>' + esc(x.mrn) + '</td><td>' + esc(x.cir) +
      '</td><td class="m">' + esc(x.descripcion) + '</td><td class="r">' + esc(x.bultos ?? '') + '</td><td>' + esc(x.tipoBulto) + '</td><td class="r">' + simple(x.peso) + '</td><td>' + esc(x.csv) + '</td></tr>').join('');
    document.getElementById('print-area').innerHTML =
      '<div class="rmt"><h1>R. M. T.</h1><div class="sub">Agrupación de documentos presentados para su despacho y posterior embarque</div>' +
      '<table class="cab"><colgroup><col style="width:16%"><col style="width:38%"><col style="width:19%"><col style="width:27%"></colgroup><tr><td>AGENCIA:</td><td class="b">' + esc(AGENCIA) + '</td><td>FECHA:</td><td class="b">' + fLarga + '</td></tr>' +
      '<tr><td>DESTINO:</td><td></td><td>MATRICULA/BUQUE:</td><td class="b">' + esc(st.clave) + '</td></tr>' +
      '<tr><td>MATRÍCULA/CONTR:</td><td></td><td>Nº DE ESCALA:</td><td></td></tr></table>' +
      '<div class="rel">Relación de documentos presentados en Aduana, para su registro y posterior embarque en el buque de referencia</div>' +
      '<table class="lin"><colgroup><col style="width:6%"><col style="width:6%"><col style="width:20%"><col style="width:7%"><col style="width:17%"><col style="width:7%"><col style="width:6%"><col style="width:8%"><col style="width:23%"></colgroup>' +
      '<thead><tr><th>Orden</th><th>Dto.</th><th>Nº Documento</th><th>CIR</th><th>Mercancía</th><th>Bultos</th><th>Tipo</th><th>P. Bruto</th><th>CSV</th></tr></thead><tbody>' + filas +
      '<tr><td colspan="5">TOTAL</td><td class="r">' + bultos + '</td><td></td><td class="r">' + miles(peso) + '</td><td></td></tr></tbody></table>' +
      '<div class="pie"><table><tr><td>FECHA</td><td style="min-width:110pt">' + fPie + '</td></tr></table><div class="firma">ADUANAS<br>FIRMA Y SELLO</div></div>' +
      '<div class="transp">EL TRANSPORTISTA</div></div>';
    const t = document.title;
    document.title = 'RMT_' + st.clave + '_' + st.fecha;
    setTimeout(() => { window.print(); document.title = t; }, 50);
  }

  render();
}
</script>
