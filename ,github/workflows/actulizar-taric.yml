name: Actualizar catálogo TARIC

on:
  repository_dispatch:
    types: [actualizar-taric]
  workflow_dispatch:
    inputs:
      id:
        description: 'ID de la fila en taric_actualizaciones'
        required: true
      extraccion:
        description: 'Carpeta en el bucket, p.ej. 2026-08'
        required: true

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --quiet openpyxl requests
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Procesar extracción y cargar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Pooler de sesión, puerto 5432: los runners son IPv4-only
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ACT_ID: ${{ github.event.client_payload.id || inputs.id }}
          EXTRACCION: ${{ github.event.client_payload.extraccion || inputs.extraccion }}
        run: python scripts/procesar_taric.py

      - name: Marcar error si algo falló
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACT_ID: ${{ github.event.client_payload.id || inputs.id }}
        run: |
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/taric_actualizaciones?id=eq.$ACT_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"estado":"error","mensaje":"El workflow falló. Revisa los logs en GitHub Actions.","terminado_en":"'"$(date -u +%FT%TZ)"'"}'
